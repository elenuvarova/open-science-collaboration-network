name: ETL pipeline

# Free on public repos. Weekly + manual. Also keeps Neon + the API warm.
on:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch:

jobs:
  etl:
    strategy:
      fail-fast: false   # one topic failing doesn't cancel the others
      matrix:
        topic:
          - "Climate adaptation"
          - "AI in education"
          - "Soil health"
          - "Circular economy"
          - "Digital health"
          - "Biodiversity conservation"
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache fastembed models
        uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-models-v1
      - name: Install ETL deps
        run: pip install -r etl/requirements.txt
      - name: Run ETL — ${{ matrix.topic }}
        working-directory: etl
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python run.py "${{ matrix.topic }}"
