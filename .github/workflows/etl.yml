name: ETL pipeline

# Free on public repos. Weekly + manual. Also keeps Neon + the API warm.
on:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch:

jobs:
  etl:
    # All 6 topics run sequentially in ONE job — a single writer to Neon, so no
    # parallel-write races (shared institutions, duplicate CORDIS projects, or
    # concurrent CREATE TABLE). After the ROR matching fix each topic is fast
    # (~3-5 min), so the whole run fits comfortably under the timeout.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache fastembed models
        uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-models-v1
      - name: Cache CORDIS ZIPs
        uses: actions/cache@v4
        with:
          path: etl/.cache
          key: cordis-zips-v1
      - name: Install ETL deps
        run: pip install -r etl/requirements.txt
      - name: Run ETL (all topics)
        working-directory: etl
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python run.py
