# Optional Render deploy descriptor (the project deploys on Coolify; this is a
# fallback). DATABASE_URL points at an external Postgres — set it as a secret in
# the Render dashboard, NOT here. The ETL runs in-process inside the app.
services:
  - type: web
    name: ai-workshop-web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        sync: false # set in dashboard from your Postgres connection string
